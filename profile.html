<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My STLNC Profile</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = 'https://nwmnamevyasyruygapeb.supabase.co';

    const SUPABASE_ANON_KEY = 'sb_publishable_OWaZPpZTVGK6FYETNa0VLQ_-1gAz1qQ';

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );
  </script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
      background: #f7f4f0;
      color: #222;
    }

    main {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      padding: 32px;
      border-radius: 20px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
    }

    #profile-status {
      margin-top: 20px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <main>

    <h1>My STLNC Profile</h1>

    <p>
      Manage the information you choose to share with the STLNC community.
    </p>

<div id="profile-status">
  Loading your profile...
</div>

<div id="profile-content" hidden>

  <label for="display-name">
    Display Name
  </label>

  <input
    type="text"
    id="display-name"
    name="display-name"
  >

  <label for="bio">
    Bio
  </label>

  <textarea
    id="bio"
    name="bio"
    rows="6"
  ></textarea>
  <label for="creative-disciplines">
  Creative Disciplines
</label>

<input
  type="text"
  id="creative-disciplines"
  name="creative-disciplines"
  placeholder="Painting, music, photography, performance..."
>

<label for="creative-disciplines-visibility">
  Who can see your creative disciplines?
</label>

<select
  id="creative-disciplines-visibility"
  name="creative-disciplines-visibility"
>
  <option value="public">Public</option>
  <option value="members">Members only</option>
  <option value="private">Private</option>
</select>
  <label for="portfolio-url">
  Portfolio URL
</label>

<label for="portfolio-url">
  Portfolio URL
</label>

<input
  type="url"
  id="portfolio-url"
  name="portfolio-url"
  placeholder="https://yourportfolio.com"
>

<label for="portfolio-visibility">
  Who can see your portfolio?
</label>

<select
  id="portfolio-visibility"
  name="portfolio-visibility"
>
  <option value="public">Public</option>
  <option value="members">Members only</option>
  <option value="private">Private</option>
</select>


<label for="location">
  Location
</label>

<input
  type="text"
  id="location"
  name="location"
  placeholder="St. Louis, MO"
>

<label for="location-visibility">
  Who can see your location?
</label>

<select
  id="location-visibility"
  name="location-visibility"
>
  <option value="public">Public</option>
  <option value="members">Members only</option>
  <option value="private">Private</option>
</select>


<label for="social-links">
  Social Links
</label>

<input
  type="url"
  id="social-links"
  name="social-links"
  placeholder="https://instagram.com/yourname"
>

<label for="social-links-visibility">
  Who can see your social links?
</label>

<select
  id="social-links-visibility"
  name="social-links-visibility"
>
  <option value="public">Public</option>
  <option value="members">Members only</option>
  <option value="private">Private</option>
</select>


<label for="looking-for">
  What are you looking for?
</label>

<textarea
  id="looking-for"
  name="looking-for"
  rows="4"
  placeholder="Collaborators, artists, events, commissions..."
></textarea>

<label for="looking-for-visibility">
  Who can see what you're looking for?
</label>

<select
  id="looking-for-visibility"
  name="looking-for-visibility"
>
  <option value="public">Public</option>
  <option value="members">Members only</option>
  <option value="private">Private</option>
</select>


<label for="creative-statement">
  Creative Statement
</label>

<textarea
  id="creative-statement"
  name="creative-statement"
  rows="6"
  placeholder="Tell people about your creative perspective..."
></textarea>

<label for="creative-statement-visibility">
  Who can see your creative statement?
</label>

<select
  id="creative-statement-visibility"
  name="creative-statement-visibility"
>
  <option value="public">Public</option>
  <option value="members">Members only</option>
  <option value="private">Private</option>
</select>


<label for="pronouns">
  Pronouns
</label>

<input
  type="text"
  id="pronouns"
  name="pronouns"
  placeholder="they/them"
>

<label for="pronouns-visibility">
  Who can see your pronouns?
</label>

<select
  id="pronouns-visibility"
  name="pronouns-visibility"
>
  <option value="public">Public</option>
  <option value="members">Members only</option>
  <option value="private">Private</option>
</select>


<label for="profile-image-url">
  Profile Image URL
</label>

<input
  type="url"
  id="profile-image-url"
  name="profile-image-url"
  placeholder="https://example.com/image.jpg"
>

<label for="profile-image-visibility">
  Who can see your profile image?
</label>

<select
  id="profile-image-visibility"
  name="profile-image-visibility"
>
  <option value="public">Public</option>
  <option value="members">Members only</option>
  <option value="private">Private</option>
</select>


<label for="communication-preferences">
  Communication Preferences
</label>

<textarea
  id="communication-preferences"
  name="communication-preferences"
  rows="4"
  placeholder="Preferred ways to communicate..."
></textarea>

<label for="communication-preferences-visibility">
  Who can see your communication preferences?
</label>

<select
  id="communication-preferences-visibility"
  name="communication-preferences-visibility"
>
  <option value="public">Public</option>
  <option value="members">Members only</option>
  <option value="private">Private</option>
</select>

  <button type="button" id="save-profile">
    Save Profile
  </button>

  <div id="save-status" aria-live="polite"></div>

</div>

  </main>

  <script>
    async function loadMyProfile() {
      const status = document.getElementById('profile-status');

      const {
        data: { user }
      } = await supabaseClient.auth.getUser();

      if (!user) {
        status.textContent = 'Please log in to manage your profile.';
        return;
      }

      const { data, error } =
        await supabaseClient.rpc('get_my_profile');

      if (error) {
        console.error('Profile error:', error);
        status.textContent = 'Unable to load your profile.';
        return;
      }

      if (!data || data.length === 0) {
        status.textContent = 'No profile was found.';
        return;
      }

      const profile = data[0];

document.getElementById('display-name').value =
  profile.display_name || '';

document.getElementById('bio').value =
  profile.bio || '';

document.getElementById('creative-disciplines').value =
  profile.creative_disciplines || '';

document.getElementById('creative-disciplines-visibility').value =
  profile.creative_disciplines_visibility || 'public';

document.getElementById('portfolio-url').value =
  profile.portfolio_url || '';

document.getElementById('portfolio-visibility').value =
  profile.portfolio_visibility || 'public';

document.getElementById('location').value =
  profile.location || '';

document.getElementById('location-visibility').value =
  profile.location_visibility || 'members';

document.getElementById('social-links').value =
  profile.social_links || '';

document.getElementById('social-links-visibility').value =
  profile.social_links_visibility || 'public';

document.getElementById('looking-for').value =
  profile.looking_for || '';

document.getElementById('looking-for-visibility').value =
  profile.looking_for_visibility || 'members';

document.getElementById('creative-statement').value =
  profile.creative_statement || '';

document.getElementById('creative-statement-visibility').value =
  profile.creative_statement_visibility || 'public';

document.getElementById('pronouns').value =
  profile.pronouns || '';

document.getElementById('pronouns-visibility').value =
  profile.pronouns_visibility || 'private';

document.getElementById('profile-image-url').value =
  profile.profile_image_url || '';

document.getElementById('profile-image-visibility').value =
  profile.profile_image_visibility || 'public';

document.getElementById('communication-preferences').value =
  profile.communication_preferences || '';

document.getElementById('communication-preferences-visibility').value =
  profile.communication_preferences_visibility || 'private';

document.getElementById('profile-content').hidden = false;

status.textContent = '';
    }
document.getElementById('save-profile').addEventListener('click', async () => {
  const saveStatus = document.getElementById('save-status');

  saveStatus.textContent = 'Saving...';

  const {
    data: { user }
  } = await supabaseClient.auth.getUser();

  if (!user) {
    saveStatus.textContent = 'Please log in first.';
    return;
  }

  const displayName =
    document.getElementById('display-name').value.trim();
  const creativeDisciplines =
  document.getElementById('creative-disciplines').value.trim();

const creativeDisciplinesVisibility =
  document.getElementById('creative-disciplines-visibility').value;

  const bio =
    document.getElementById('bio').value.trim();

  const { error } = await supabaseClient
    .from('profiles')
 .update({
  display_name: displayName,
  bio: bio,
  creative_disciplines: creativeDisciplines,
  creative_disciplines_visibility: creativeDisciplinesVisibility
})
    .eq('user_id', user.id);

  if (error) {
    console.error('Save profile error:', error);
    saveStatus.textContent = 'Unable to save your profile.';
    return;
  }

  saveStatus.textContent = 'Profile saved!';
});
    loadMyProfile();
  </script>

</body>
</html>
