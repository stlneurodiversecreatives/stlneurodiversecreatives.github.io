<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>STLNC Creative Directory</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = 'https://nwmnamevyasyruygapeb.supabase.co';
    const SUPABASE_ANON_KEY = 'nwmnamevyasyruygapeb';

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );
    console.log("DIRECTORY SUPABASE CLIENT:", supabaseClient);
  </script>
</head>

<body>

  <main>
    <p>STLNC DIRECTORY TEST</p>
    <h1>STLNC Creative Directory</h1>

    <p>Explore creatives connected to St. Louis Neurodiverse Creatives.</p>

    <div id="directory-status">Loading creatives...</div>

    <div id="directory-list"></div>
    <script>
  async function loadDirectory() {
    const status = document.getElementById('directory-status');
    const directory = document.getElementById('directory-list');

    const { data, error } = await supabaseClient.rpc('get_public_profiles');

    if (error) {
      console.error('Directory error:', error);
      status.textContent = 'Unable to load the directory.';
      return;
    }

    status.textContent = '';

    data.forEach(profile => {
      const card = document.createElement('article');

      card.innerHTML = `
        <h2>${profile.display_name || 'STLNC Creative'}</h2>
        <p>${profile.bio || ''}</p>
        <p><strong>Creative disciplines:</strong> ${profile.creative_disciplines || ''}</p>
      `;

      directory.appendChild(card);
    });
  }

  loadDirectory();
</script>
  </main>

</body>
</html>
