<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>STLNC Creative Directory</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = 'https://nwmnamevyasyruygapeb.supabase.co';

    const SUPABASE_ANON_KEY = 'sb_publishable_OWaZPpZTVGK6FYETNa0VLQ_-1gAz1qQ';

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );
  </script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
      background: #f7f4f0;
      color: #222;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 10px;
    }

    #directory-status {
      margin: 30px 0;
    }

    #directory-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
      margin-top: 35px;
    }

.creative-card {
  background: white;
  border-radius: 20px;
  padding: 28px;
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.creative-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
}

.creative-card-content {
  text-align: center;
}

    .creative-profile-image,
    .creative-profile-placeholder {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      display: block;
      margin: 0 auto 18px;
    }

    .creative-profile-image {
      object-fit: cover;
    }

    .creative-profile-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      font-weight: bold;
      background: #e8e1d9;
    }

    .creative-card h2 {
      margin-top: 0;
      margin-bottom: 10px;
      text-align: center;
    }

.creative-disciplines {
  font-weight: bold;
  margin-bottom: 18px;
  line-height: 1.5;
}

.creative-bio,
.creative-statement {
  line-height: 1.7;
  text-align: left;
}
    .profile-section h3 {
  margin-bottom: 6px;
  font-size: 0.9rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.profile-section {
  margin-top: 18px;
}

    .creative-statement {
      font-style: italic;
    }

 .profile-button {
  display: inline-block;
  margin-top: 14px;
  padding: 10px 18px;
  border-radius: 999px;
  text-decoration: none;
  font-weight: bold;
  background: #222;
  color: white;
  transition: transform 0.2s ease, opacity 0.2s ease;
}
    .profile-links {
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 14px;
}

.profile-links .profile-button {
  margin-top: 0;
}

.creative-card a:hover {
  transform: translateY(-2px);
  opacity: 0.85;
}
  </style>
</head>

<body>

  <main>

    <h1>STLNC Creative Directory</h1>

    <p>
      Explore the STLNC Creative Database
    </p>
    
<form id="directory-search-form" role="search">

  <label for="directory-search">
    Search the directory
  </label>

  <div class="search-row">

    <input
      type="search"
      id="directory-search"
      placeholder="Name, discipline, or keyword"
    >

    <button type="submit">
      Search
    </button>

  </div>

</form>

    <div id="directory-status">
      Loading creatives...
    </div>

    <div id="directory-list"></div>

  </main>

  <script>
    async function loadDirectory() {
      const status = document.getElementById('directory-status');
      const directory = document.getElementById('directory-list');

      const { data, error } =
        await supabaseClient.rpc('get_public_profiles');

      if (error) {
        console.error('Directory error:', error);
        status.textContent = 'Unable to load the directory.';
        return;
      }

      status.textContent = '';

      data.forEach(profile => {

        const card = document.createElement('article');

        card.className = 'creative-card';

card.innerHTML = `
  <div class="creative-card-content">

    ${
      profile.profile_image_url
        ? `
          <img
            class="creative-profile-image"
            src="${profile.profile_image_url}"
            alt="${profile.display_name || 'STLNC Creative'}"
          >
        `
        : `
          <div class="creative-profile-placeholder">
            ${
              profile.display_name
                ? profile.display_name.charAt(0).toUpperCase()
                : 'S'
            }
          </div>
        `
    }

    <h2>
      ${profile.display_name || 'STLNC Creative'}
    </h2>

    ${
      profile.creative_disciplines
        ? `
          <p class="creative-disciplines">
            ${profile.creative_disciplines}
          </p>
        `
        : ''
    }
    ${
  profile.location
    ? `
      <p class="creative-location">
        📍 ${profile.location}
      </p>
    `
    : ''
}
${
  profile.bio
    ? `
      <div class="profile-section">
        <h3>About</h3>
        <p class="creative-bio">
          ${profile.bio}
        </p>
      </div>
    `
    : ''
}

    ${
      profile.creative_statement
        ? `
          <p class="creative-statement">
            ${profile.creative_statement}
          </p>
        `
        : ''
    }
${
  profile.looking_for
    ? `
      <div class="profile-section">
        <h3>Looking For</h3>
        <p>
          ${profile.looking_for}
        </p>
      </div>
    `
    : ''
}
<div class="profile-links">
    ${
      profile.portfolio_url
        ? `
          <p>
            <a
              class="profile-button"
              href="${profile.portfolio_url}"
              target="_blank"
              rel="noopener noreferrer"
            >
              View Portfolio
            </a>
          </p>
        `
        : ''
    }
${
  profile.social_links
    ? `
      <p>
        <a
          class="profile-button"
          href="${profile.social_links}"
          target="_blank"
          rel="noopener noreferrer"
        >
          Social / Website
        </a>
      </p>
    `
    : ''
}
 </div>
</div>
`;

       directory.appendChild(card);
    });

 const searchForm = document.getElementById('directory-search-form');
const search = document.getElementById('directory-search');

searchForm.addEventListener('submit', (event) => {
  event.preventDefault();

  const searchTerm = search.value.toLowerCase().trim();

  const cards = document.querySelectorAll('.creative-card');

  cards.forEach(card => {
    const cardText = card.textContent.toLowerCase();

    if (searchTerm === '' || cardText.includes(searchTerm)) {
      card.style.display = '';
    } else {
      card.style.display = 'none';
    }
  });
      const searchTerm = search.value.toLowerCase().trim();

      const cards = document.querySelectorAll('.creative-card');

      cards.forEach(card => {
        const cardText = card.textContent.toLowerCase();

        if (cardText.includes(searchTerm)) {
          card.style.display = '';
        } else {
          card.style.display = 'none';
        }
      });
  }

  loadDirectory();
  </script>

</body>
</html>
