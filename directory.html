<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>STLNC Creative Directory</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = 'https://nwmnamevyasyruygapeb.supabase.co';

    const SUPABASE_ANON_KEY = 'sb_publishable_OWaZPpZTVGK6FYETNa0VLQ_-1gAz1qQ';

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );
  </script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
      background: #f7f4f0;
      color: #222;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 10px;
    }

    #directory-status {
      margin: 30px 0;
    }

    #directory-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
      margin-top: 35px;
    }

.creative-card {
  background: white;
  border-radius: 20px;
  padding: 28px;
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.creative-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
}

.creative-card-content {
  text-align: center;
}

    .creative-profile-image,
    .creative-profile-placeholder {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      display: block;
      margin: 0 auto 18px;
    }

    .creative-profile-image {
      object-fit: cover;
    }

    .creative-profile-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      font-weight: bold;
      background: #e8e1d9;
    }

    .creative-card h2 {
      margin-top: 0;
      margin-bottom: 10px;
      text-align: center;
    }

.creative-disciplines {
  font-weight: bold;
  margin-bottom: 18px;
  line-height: 1.5;
}

.creative-bio,
.creative-statement {
  line-height: 1.7;
  text-align: left;
}

    .creative-statement {
      font-style: italic;
    }

    .creative-card a {
      display: inline-block;
      margin-top: 10px;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <main>

    <p>STLNC DIRECTORY TEST</p>

    <h1>STLNC Creative Directory</h1>

    <p>
      Explore creatives connected to St. Louis Neurodiverse Creatives.
    </p>

    <div id="directory-status">
      Loading creatives...
    </div>

    <div id="directory-list"></div>

  </main>

  <script>
    async function loadDirectory() {
      const status = document.getElementById('directory-status');
      const directory = document.getElementById('directory-list');

      const { data, error } =
        await supabaseClient.rpc('get_public_profiles');

      if (error) {
        console.error('Directory error:', error);
        status.textContent = 'Unable to load the directory.';
        return;
      }

      status.textContent = '';

      data.forEach(profile => {

        const card = document.createElement('article');

        card.className = 'creative-card';

        card.innerHTML = `
          <div class="creative-card-content">

            ${
              profile.profile_image_url
                ? `
                  <img
                    class="creative-profile-image"
                    src="${profile.profile_image_url}"
                    alt="${profile.display_name || 'STLNC Creative'}"
                  >
                `
                : `
                  <div class="creative-profile-placeholder">
                    ${
                      profile.display_name
                        ? profile.display_name.charAt(0).toUpperCase()
                        : 'S'
                    }
                  </div>
                `
            }

            <h2>
              ${profile.display_name || 'STLNC Creative'}
            </h2>

            ${
              profile.creative_disciplines
                ? `
                  <p class="creative-disciplines">
                    ${profile.creative_disciplines}
                  </p>
                `
                : ''
            }

            ${
              profile.bio
                ? `
                  <p class="creative-bio">
                    ${profile.bio}
                  </p>
                `
                : ''
            }

            ${
              profile.creative_statement
                ? `
                  <p class="creative-statement">
                    ${profile.creative_statement}
                  </p>
                `
                : ''
            }

            ${
              profile.looking_for
                ? `
                  <p>
                    <strong>Looking for:</strong>
                    ${profile.looking_for}
                  </p>
                `
                : ''
            }

            ${
              profile.portfolio_url
                ? `
                  <p>
                    <a
                      href="${profile.portfolio_url}"
                      target="_blank"
                      rel="noopener noreferrer"
                    >
                      View Portfolio
                    </a>
                  </p>
                `
                : ''
            }

          </div>
        `;

        directory.appendChild(card);
      });
    }

    loadDirectory();
  </script>

</body>
</html>
