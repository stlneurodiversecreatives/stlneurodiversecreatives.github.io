  <!-- DIRECTORY CONTENT -->

  <main>

<h1>STLNC Creative Directory</h1>

<p class="intro">
  Explore creatives from the St. Louis community.
</p>


<!-- SEARCH -->
<form id="directory-search-form">

  <label for="directory-search">
    Search the directory
  </label>

  <div class="search-row">

    <input
      type="search"
      id="directory-search"
      placeholder="Search by name, discipline, location, etc."
    >

    <button type="submit">
      Search
    </button>

  </div>

</form>


<!-- STATUS -->
<div id="directory-status">
  Loading directory...
</div>


<!-- DIRECTORY RESULTS -->
<div id="directory-list"></div>

  </main>

  <!-- DARK MODE -->

  <script>

    document.addEventListener('DOMContentLoaded', function () {

      const themeToggle =
        document.getElementById('theme-toggle');

      if (!themeToggle) {
        return;
      }

      const savedTheme =
        localStorage.getItem('theme');

      if (savedTheme === 'dark') {

        document.documentElement.setAttribute(
          'data-theme',
          'dark'
        );

        themeToggle.textContent =
          '☀️ Light Mode';

      } else {

        document.documentElement.removeAttribute(
          'data-theme'
        );

        themeToggle.textContent =
          '🌙 Dark Mode';
      }


      themeToggle.addEventListener(
        'click',
        function () {

          const currentTheme =
            document.documentElement.getAttribute(
              'data-theme'
            );

          if (currentTheme === 'dark') {

            document.documentElement.removeAttribute(
              'data-theme'
            );

            localStorage.setItem(
              'theme',
              'light'
            );

            themeToggle.textContent =
              '🌙 Dark Mode';

          } else {

            document.documentElement.setAttribute(
              'data-theme',
              'dark'
            );

            localStorage.setItem(
              'theme',
              'dark'
            );

            themeToggle.textContent =
              '☀️ Light Mode';
          }

        }
      );

    });

  </script>
<script>
async function loadDirectory() {

  const status = document.getElementById('directory-status');
  const list = document.getElementById('directory-list');

  if (!status || !list) {
    return;
  }

  status.textContent = 'Loading directory...';
  list.innerHTML = '';

  try {

    const { data, error } =
      await supabaseClient.rpc('get_public_profiles');

    if (error) {
      console.error('Directory error:', error);
      status.textContent = 'Unable to load the directory.';
      return;
    }

    if (!data || data.length === 0) {
      status.textContent = 'No public profiles found.';
      return;
    }

    status.textContent = '';

    data.forEach(profile => {

      const card =
        document.createElement('div');

      card.className = 'creative-card';

      card.innerHTML = `

        <div class="creative-card-content">

          ${
            profile.profile_image_url
              ? `<img
                   class="creative-profile-image"
                   src="${profile.profile_image_url}"
                   alt="${profile.display_name || 'Creative profile'}"
                 >`
              : `<div class="creative-profile-placeholder">
                   ${(profile.display_name || '?').charAt(0).toUpperCase()}
                 </div>`
          }

          <h2>
            ${profile.display_name || 'Unnamed Creative'}
          </h2>

          ${
            profile.creative_disciplines
              ? `<div class="creative-disciplines">
                   ${profile.creative_disciplines}
                 </div>`
              : ''
          }

          ${
            profile.location
              ? `<div class="creative-location">
                   ${profile.location}
                 </div>`
              : ''
          }

          ${
            profile.bio
              ? `<div class="creative-bio">
                   ${profile.bio}
                 </div>`
              : ''
          }

          ${
            profile.creative_statement
              ? `<div class="creative-statement">
                   ${profile.creative_statement}
                 </div>`
              : ''
          }

        </div>

      `;

      list.appendChild(card);

    });

  } catch (error) {

    console.error('Directory error:', error);

    status.textContent =
      'Unable to load the directory.';
  }
}


document.addEventListener(
  'DOMContentLoaded',
  loadDirectory
);
</script>
</body>
