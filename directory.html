<head>

  <meta charset="UTF-8">

  <title>STLNC</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = 'https://nwmnamevyasyruygapeb.supabase.co';

    const SUPABASE_ANON_KEY =
      'sb_publishable_OWaZPpZTVGK6FYETNa0VLQ_-1gAz1qQ';

  
  window.supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
      );

     /*
      ACCOUNT NAVIGATION
    */

    async function updateAccountNav() {

      const accountNav =
        document.getElementById('account-nav');

      if (!accountNav) {
        return;
      }


      const {
        data: {
          session
        }
      } =
        await supabaseClient.auth.getSession();


      accountNav.innerHTML = '';


      if (session) {

        const profileLink =
          document.createElement('a');

        profileLink.href =
          'profile.html';

        profileLink.textContent =
          'My Profile';


        const logoutLink =
          document.createElement('a');

        logoutLink.href =
          '#';

        logoutLink.textContent =
          'Log Out';

        logoutLink.addEventListener(
          'click',
          async (event) => {

            event.preventDefault();

            const {
              error
            } =
              await supabaseClient.auth.signOut();


            if (error) {

              console.error(
                'Logout error:',
                error
              );

              return;
            }

            window.location.href =
              'index.html';

          }
        );


        accountNav.appendChild(
          profileLink
        );

        accountNav.appendChild(
          logoutLink
        );


      } else {

        const joinLink =
          document.createElement('a');

        joinLink.href =
          'signup.html';

        joinLink.textContent =
          'Join STLNC';


        const loginLink =
          document.createElement('a');

        loginLink.href =
          'login.html';

        loginLink.textContent =
          'Log In';


        accountNav.appendChild(
          joinLink
        );

        accountNav.appendChild(
          loginLink
        );

      }
    }

  </script>

  <!-- Shared CSS -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Shared JavaScript -->

</head>


<body>
</button>
<div class="account-nav" id="account-nav" aria-label="Account navigation">

  <button id="theme-toggle" type="button" aria-label="Toggle dark mode">
    🌙 Dark Mode
  </button>

  <div class="account-links" id="account-links">
    <a href="signup.html">Join STLNC</a>

</div>

  <!-- MAIN SITE NAVIGATION -->

  <nav
    class="main-nav"
    aria-label="Main navigation"

    <div class="main-nav-inner">

      <a
        class="site-name"
        href="index.html"
      >

      </a>

      <div class="main-nav-links">

        <a href="index.html">

        </a>

        <a href="about.html">
          About
        </a>

        <a href="gallery.html">
          Gallery
        </a>

        <a
          href="directory.html"
          class="current"
          aria-current="page"
        >
          Directory
        </a>

        <a href="events.html">
          Events
        </a>

        <a href="contact.html">
          Contact
        </a>

      </div>

    </div>

  </nav>


  <!-- DIRECTORY CONTENT -->

  <main>

    <h1>
      STLNC Creative Directory
    </h1>

    <p class="intro
    </p>


    <!-- SEARCH -->

    <form
      id="directory-search-form"
      role="search"
    >

      <label for="directory-search">
        Search the directory
      </label>

      <div class="search-row">

        <input
          type="search"
          id="directory-search"
          name="directory-search"
          placeholder="Name, discipline, or keyword"
          autocomplete="off"
        >

        <button type="submit">
          Search
        </button>

      </div>

    </form>


    <div
      id="directory-status"
      aria-live="polite"
    >
      Loading creatives...
    </div>


    <div id="directory-list"></div>

  </main>


  <!-- SUPABASE + DIRECTORY CODE -->

  <script>

    const SUPABASE_URL =
      'https://nwmnamevyasyruygapeb.supabase.co';

    const SUPABASE_ANON_KEY =
      'sb_publishable_OWaZPpZTVGK6FYETNa0VLQ_-1gAz1qQ';


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    /*
      ACCOUNT NAVIGATION
    */

    async function updateAccountNav() {

      const accountNav =
        document.getElementById('account-nav');

      if (!accountNav) {
        return;
      }


      const {
        data: {
          session
        }
      } =
        await supabaseClient.auth.getSession();


      accountNav.innerHTML = '';


      if (session) {

        const profileLink =
          document.createElement('a');

        profileLink.href =
          'profile.html';

        profileLink.textContent =
          'My Profile';


        const logoutLink =
          document.createElement('a');

        logoutLink.href =
          '#';

        logoutLink.textContent =
          'Log Out';

        logoutLink.addEventListener(
          'click',
          async (event) => {

            event.preventDefault();

            const {
              error
            } =
              await supabaseClient.auth.signOut();


            if (error) {

              console.error(
                'Logout error:',
                error
              );

              return;
            }

            window.location.href =
              'index.html';

          }
        );


        accountNav.appendChild(
          profileLink
        );

        accountNav.appendChild(
          logoutLink
        );


      } else {

        const joinLink =
          document.createElement('a');

        joinLink.href =
          'signup.html';

        joinLink.textContent =
          'Join STLNC';


        const loginLink =
          document.createElement('a');

        loginLink.href =
          'login.html';

        loginLink.textContent =
          'Log In';


        accountNav.appendChild(
          joinLink
        );

        accountNav.appendChild(
          loginLink
        );

      }
    }


    /*
      SAFE URL CHECK
    */

    function getSafeUrl(value) {

      if (!value) {
        return null;
      }

      try {

        const url =
          new URL(value);

        if (
          url.protocol === 'https:' ||
          url.protocol === 'http:'
        ) {
          return url.href;
        }

      } catch (error) {

        return null;

      }

      return null;
    }


    /*
      LOAD DIRECTORY
    */

    async function loadDirectory() {

      const status =
        document.getElementById(
          'directory-status'
        );

      const directory =
        document.getElementById(
          'directory-list'
        );


      const {
        data,
        error
      } =
        await supabaseClient.rpc(
          'get_public_profiles'
        );


      if (error) {

        console.error(
          'Directory error:',
          error
        );

        status.textContent =
          'Unable to load the directory.';

        return;
      }


      status.textContent =
        '';

      directory.innerHTML =
        '';


      if (!data || data.length === 0) {

        status.textContent =
          'No public creatives are currently listed.';

        return;
      }


      data.forEach(
        (profile) => {

          const card =
            document.createElement(
              'article'
            );

          card.className =
            'creative-card';


          const content =
            document.createElement(
              'div'
            );

          content.className =
            'creative-card-content';


          /*
            IMAGE
          */

          if (
            profile.profile_image_url
          ) {

            const imageUrl =
              getSafeUrl(
                profile.profile_image_url
              );


            if (imageUrl) {

              const image =
                document.createElement(
                  'img'
                );

              image.className =
                'creative-profile-image';

              image.src =
                imageUrl;

              image.alt =
                profile.display_name
                  ? profile.display_name + ' profile image'
                  : 'STLNC creative profile image';

              content.appendChild(
                image
              );

            } else {

              createPlaceholder(
                content,
                profile
              );

            }

          } else {

            createPlaceholder(
              content,
              profile
            );

          }


          /*
            NAME
          */

          const name =
            document.createElement(
              'h2'
            );

          name.textContent =
            profile.display_name ||
            'STLNC Creative';

          content.appendChild(
            name
          );


          /*
            DISCIPLINES
          */

          if (
            profile.creative_disciplines
          ) {

            const disciplines =
              document.createElement(
                'p'
              );

            disciplines.className =
              'creative-disciplines';

            disciplines.textContent =
              profile.creative_disciplines;

            content.appendChild(
              disciplines
            );

          }


          /*
            LOCATION
          */

          if (
            profile.location
          ) {

            const location =
              document.createElement(
                'p'
              );

            location.className =
              'creative-location';

            location.textContent =
              '📍 ' +
              profile.location;

            content.appendChild(
              location
            );

          }


          /*
            BIO
          */

          if (
            profile.bio
          ) {

            const about =
              document.createElement(
                'div'
              );

            about.className =
              'profile-section';


            const heading =
              document.createElement(
                'h3'
              );

            heading.textContent =
              'About';


            const bio =
              document.createElement(
                'p'
              );

            bio.className =
              'creative-bio';

            bio.textContent =
              profile.bio;


            about.appendChild(
              heading
            );

            about.appendChild(
              bio
            );

            content.appendChild(
              about
            );

          }


          /*
            CREATIVE STATEMENT
          */

          if (
            profile.creative_statement
          ) {

            const statement =
              document.createElement(
                'p'
              );

            statement.className =
              'creative-statement';

            statement.textContent =
              profile.creative_statement;

            content.appendChild(
              statement
            );

          }


          /*
            LOOKING FOR
          */

          if (
            profile.looking_for
          ) {

            const lookingFor =
              document.createElement(
                'div'
              );

            lookingFor.className =
              'profile-section';


            const heading =
              document.createElement(
                'h3'
              );

            heading.textContent =
              'Looking For';


            const text =
              document.createElement(
                'p'
              );

            text.textContent =
              profile.looking_for;


            lookingFor.appendChild(
              heading
            );

            lookingFor.appendChild(
              text
            );

            content.appendChild(
              lookingFor
            );

          }


          /*
            LINKS
          */

          const links =
            document.createElement(
              'div'
            );

          links.className =
            'profile-links';


          if (
            profile.portfolio_url
          ) {

            const portfolioUrl =
              getSafeUrl(
                profile.portfolio_url
              );


            if (portfolioUrl) {

              const portfolio =
                document.createElement(
                  'a'
                );

              portfolio.className =
                'profile-button';

              portfolio.href =
                portfolioUrl;

              portfolio.target =
                '_blank';

              portfolio.rel =
                'noopener noreferrer';

              portfolio.textContent =
                'View Portfolio';

              links.appendChild(
                portfolio
              );

            }

          }


          if (
            profile.social_links
          ) {

            const socialUrl =
              getSafeUrl(
                profile.social_links
              );


            if (socialUrl) {

              const social =
                document.createElement(
                  'a'
                );

              social.className =
                'profile-button';

              social.href =
                socialUrl;

              social.target =
                '_blank';

              social.rel =
                'noopener noreferrer';

              social.textContent =
                'Social / Website';

              links.appendChild(
                social
              );

            }

          }


          if (
            links.children.length > 0
          ) {

            content.appendChild(
              links
            );

          }


          card.appendChild(
            content
          );

          directory.appendChild(
            card
          );

        }
      );


      /*
        SEARCH
      */

      const searchForm =
        document.getElementById(
          'directory-search-form'
        );

      const search =
        document.getElementById(
          'directory-search'
        );


      searchForm.addEventListener(
        'submit',
        (event) => {

          event.preventDefault();


          const searchTerm =
            search.value
              .toLowerCase()
              .trim();


          const cards =
            document.querySelectorAll(
              '.creative-card'
            );


          let visibleCount = 0;


          cards.forEach(
            (card) => {

              const cardText =
                card.textContent
                  .toLowerCase();


              if (
                searchTerm === '' ||
                cardText.includes(
                  searchTerm
                )
              ) {

                card.style.display =
                  '';

                visibleCount++;

              } else {

                card.style.display =
                  'none';

              }

            }
          );


          if (
            searchTerm !== '' &&
            visibleCount === 0
          ) {

            status.textContent =
              'No creatives matched your search.';

          } else {

            status.textContent =
              '';

          }

        }
      );

    }


    /*
      PROFILE IMAGE PLACEHOLDER
    */

    function createPlaceholder(
      container,
      profile
    ) {

      const placeholder =
        document.createElement(
          'div'
        );

      placeholder.className =
        'creative-profile-placeholder';


      placeholder.textContent =
        profile.display_name
          ? profile.display_name
              .charAt(0)
              .toUpperCase()
          : 'S';


      container.appendChild(
        placeholder
      );

    }


    /*
      START
    */

    updateAccountNav();

    loadDirectory();


    supabaseClient.auth.onAuthStateChange(
      () => {
        updateAccountNav();
      }
    );

  </script>

</body>
</html>
